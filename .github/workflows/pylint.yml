name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: python -m pip install flake8==6.1.0
      - run: flake8 .

  tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - name: Isolate test outputs
        run: echo "VIDEO_PRESERVATION_ROOT=$RUNNER_TEMP/VideoPreservation" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq mkvtoolnix gpac shellcheck
      - name: Install CPU test environment
        run: |
          python -m venv venv
          venv/bin/python -m pip install --upgrade pip setuptools wheel
          venv/bin/python -m pip install numpy==1.25.0 cython
          venv/bin/python -m pip install torch==2.11.0 torchvision==0.26.0 torchaudio==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          # Build BasicSR against the installed CPU stack rather than downloading
          # another torch build into an isolated build environment.
          venv/bin/python -m pip install --no-build-isolation --no-deps basicsr==1.4.2
          venv/bin/python -m pip install -r requirements.txt
          venv/bin/python dev_tools/patch_basicsr.py
          venv/bin/python -m pip install -e . --no-deps
          venv/bin/python -m pip install -r requirements-dev.txt
          dev_tools/fetch_models.sh
      - name: Shell interfaces
        run: bash tests/run_pipeline_shell_tests.sh
      - name: Pipeline functional checks
        run: bash tests/run_pipeline_functional_tests.sh
      - name: Python tests
        run: venv/bin/python -m pytest -q
