[flake8]
ignore =
    # line break before binary operator (W503)
    W503,
    # line break after binary operator (W504)
    W504,
max-line-length=120
extend-exclude = venv,.venv,rife-ncnn-vulkan,rife-ncnn-vulkan-20221029-ubuntu,*_wrapper.*

[yapf]
based_on_style = pep8
column_limit = 120
blank_line_before_nested_class_or_def = true
split_before_expression_after_opening_paren = true

[isort]
line_length = 120
multi_line_output = 0
known_standard_library = pkg_resources,setuptools
known_first_party = realesrgan
known_third_party = PIL,basicsr,cv2,numpy,pytest,torch,torchvision,tqdm,yaml
no_lines_before = STDLIB,LOCALFOLDER
default_section = THIRDPARTY

[codespell]
skip = .git,./docs/build
count =
quiet-level = 3

[aliases]
test=pytest

[tool:pytest]
addopts=tests/
# BasicSR's VGG loader uses deprecated torchvision arguments in training tests.
# Filter only those messages so unrelated warnings remain visible.
filterwarnings =
    ignore:The parameter 'pretrained' is deprecated:UserWarning
    ignore:Arguments other than a weight enum:UserWarning
